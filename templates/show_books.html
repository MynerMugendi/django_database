{% extends 'master.html' %}

{% block title%} Add Book {% endblock%}

{% block content%}
<div class="container">
    {% for book in books %}
    <h3>{{ book.title }}</h3>
    {% if book.cover%}
        <img src="{{ book.cover.url }}" alt="">
    {% endif %}
    <p>{{ book.isbn }}</p>
    {% if perms.app.delete_book %}
    <a href="{% url 'delete_book' book.id %}" class="btn btn-danger">Delete</a>
    {% endif %}
    <a href="{% url 'edit_book' book.id %}" class="btn btn-primary">Edit</a>
    <hr>
    {% endfor %}

</div>
{% endblock %}
